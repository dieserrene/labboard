<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabBoard</title>
</head>

<body>
<h1>LabBoard</h1>
<pre id="serverliste">Lade Daten …</pre>
</body>

<script>
  fetch("/api/servers")
    .then(antwort => antwort.json())
    .then(daten => {
      document.getElementById("serverliste").textContent =
        JSON.stringify(daten, null, 2);
    });
</script>
